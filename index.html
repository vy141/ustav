<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e5e2da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Устав">
<meta name="format-detection" content="telephone=no">
<title>Устав дня</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e5e2da;--ink:#161616;--muted:#4f4c46;--soft:#6b675f;--line:#c3bfb5;--line2:#d3cfc5;
  --accent:#e5482b;--dim:#8a867c;--fut:#cfcbc1;--well:#ebe8e1;--pressed:#d8d4ca;
  --hel:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.screen{display:none;min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;padding:calc(var(--sat) + 14px) 20px calc(var(--sab) + 20px);flex-direction:column;gap:18px}
.screen.on{display:flex}
body.has-bar .screen.on{padding-bottom:calc(var(--sab) + 92px)}
.grow{flex:1 1 auto}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.mono.s{font-size:11px}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.h1{font-family:var(--hel);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:0}
.h1.xl{font-size:34px;line-height:1.05}
.h2{font-family:var(--hel);font-weight:500;font-size:17px;line-height:1.25;margin:0}
.lead{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.rule{height:1px;background:var(--line);flex:none}
.sec{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top .end{margin-left:auto}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1.2px solid var(--ink);border-radius:999px;padding:5px 10px;white-space:nowrap}
.phys{background:linear-gradient(180deg,#f1efea 0%,#e0ddd5 100%);box-shadow:0 4px 10px -4px rgba(0,0,0,.35),inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.05);border:0;cursor:pointer;color:var(--ink);text-decoration:none}
.phys:active,.phys.down{background:var(--pressed);box-shadow:inset 0 2px 5px rgba(0,0,0,.22),inset 0 -1px 0 rgba(255,255,255,.6)}
.phys:disabled{opacity:.45;cursor:default}
.round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.round.l{width:48px;height:48px}
.round.s{width:32px;height:32px}
.btn{height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;width:100%;padding:0 16px}
.chip{height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 14px;font-size:13px;font-weight:500;flex:none}
.primary{height:64px;width:100%;border:0;border-radius:999px;background:linear-gradient(180deg,#e2532e 0%,#c63a1b 100%);box-shadow:0 8px 18px -8px rgba(150,40,10,.7),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14);color:#fff7f2;font-weight:600;font-size:14px;cursor:pointer;flex:none}
.primary:active{transform:translateY(1px);box-shadow:0 4px 10px -6px rgba(150,40,10,.7),inset 0 2px 4px rgba(0,0,0,.2)}
.primary:disabled{opacity:.45;cursor:default}
.textbtn{height:44px;border:0;background:none;font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.stack{display:flex;flex-direction:column;gap:8px}
/* two-position toggles */
.tog{position:relative;flex:none;border:0;padding:0;border-radius:999px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.2),inset 0 -1px 0 #fff;cursor:pointer;height:48px;width:150px}
.tog.w{width:100%;height:52px}
.tog.m{width:196px;height:52px}
.tog .opt{position:absolute;top:0;height:100%;width:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tog .opt.l{left:0}.tog .opt.r{right:0}
.tog .knob{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 7px);border-radius:999px;background:linear-gradient(180deg,#f8f6f1 0%,#e2dfd7 100%);box-shadow:0 5px 12px -4px rgba(0,0,0,.4),inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);transition:left .18s ease;white-space:nowrap}
.tog.right .knob{left:calc(50% + 2px)}
.mini{position:relative;width:50px;height:30px;border:0;padding:0;border-radius:999px;background:var(--well);box-shadow:inset 0 2px 5px rgba(0,0,0,.2),inset 0 -1px 0 #fff;cursor:pointer;flex:none}
.mini::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#f8f6f1,#e2dfd7);box-shadow:0 3px 7px -2px rgba(0,0,0,.4),inset 0 1px 0 #fff;transition:left .18s ease}
.mini[aria-checked="true"]{background:#d3cfc5}
.mini[aria-checked="true"]::after{left:23px}
/* clock */
.clock{display:flex;align-items:center;justify-content:center;gap:12px;flex:none}
.tile{position:relative;width:min(136px,37vw);height:96px;border-radius:26px;background:linear-gradient(180deg,#ece9e3 0%,#e6e3dc 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 6px 14px -10px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;font-family:var(--hel);font-weight:500;font-size:min(76px,20vw);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tile::after{content:"";position:absolute;left:0;right:0;top:48px;height:1px;background:rgba(0,0,0,.08)}
.colon{display:flex;flex-direction:column;gap:14px}
.colon i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;gap:8px;max-width:520px;margin:0 auto;padding:10px 20px calc(var(--sab) + 12px);background:var(--paper)}
body.has-bar .bar{display:flex}
body.kb .bar{display:none}
.bar a{flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.dot.s{width:6px;height:6px}
/* strip */
.strip{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.strip .col span:first-child{font-size:14px;font-weight:500}
.strip .col span:last-child{font-size:12px;color:var(--muted)}
.strip .chip{height:36px}
.x{width:32px;height:32px;border:0;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
/* now */
.scale{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden}
.band{position:absolute;left:0;width:3px;border-radius:2px}
.b-done{background:var(--ink)}.b-cur{background:var(--ink);opacity:.35}.b-fut{background:#b3afa5}.b-miss{background:#d3cfc5}
.tk{position:absolute;right:0;height:1px;width:11px;background:#8d897f}
.tk.hr{width:24px}
.hl{position:absolute;right:32px;font:400 11px/1 var(--mono);color:var(--muted)}
.sl{position:absolute;left:16px;right:72px;display:flex;gap:8px;align-items:baseline}
.sl .t{font:12px var(--mono);color:var(--muted);width:42px;flex:none}
.sl .n{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .n.cur{color:var(--ink);font-weight:600}
.nowline{position:absolute;left:1.5px;right:0;height:2px;background:var(--accent)}
.nowdot{position:absolute;left:-3.5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.slide{position:relative;height:64px;border-radius:999px;background:#d8d4ca;box-shadow:inset 0 2px 6px rgba(0,0,0,.2),inset 0 -1px 0 rgba(255,255,255,.65);flex:none;user-select:none;-webkit-user-select:none}
.slide .lbl{position:absolute;left:126px;right:12px;top:0;bottom:0;display:flex;align-items:center;color:var(--muted)}
.slide .kn{position:absolute;left:6px;top:6px;width:104px;height:52px;border:0;border-radius:999px;background:linear-gradient(180deg,#f36c45 0%,#d8401e 100%);box-shadow:0 5px 12px -4px rgba(150,40,10,.65),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
/* day list */
.dlist{position:relative;display:flex;flex-direction:column}
.dlist::before{content:"";position:absolute;left:66.5px;top:15px;bottom:15px;width:1px;background:var(--line)}
.drow{display:flex;align-items:center;gap:12px;min-height:30px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.drow .t{font:12px var(--mono);color:var(--muted);width:46px;flex:none}
.drow .n{font-size:15px}
.drow.cur .t{color:var(--ink);font-weight:500}
.drow.cur .n{font-weight:600}
.drow.fut .n{color:var(--muted)}
.c{width:18px;height:18px;border-radius:50%;flex:none;position:relative;z-index:1;box-sizing:border-box}
.c-done{background:var(--ink)}
.c-miss{border:1.3px solid var(--dim);background:var(--paper)}
.c-now{background:var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--accent)}
.c-fut{background:var(--fut)}
.big{font-family:var(--hel);font-weight:500;letter-spacing:-.03em;line-height:.82}
.of{font-family:var(--hel);font-weight:500;font-size:24px;letter-spacing:-.02em;line-height:1;color:var(--soft)}
/* journal */
.qrow{display:flex;align-items:center;gap:10px}
.qrow label{flex:1;font-family:var(--hel);font-weight:500;font-size:17px;line-height:1.3}
.qhelp{font:600 15px Inter,sans-serif}
.note{position:relative;background:#f1efea;border-radius:14px;padding:14px 16px;box-shadow:0 10px 22px -12px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.note::before{content:"";position:absolute;right:12px;top:-6px;width:12px;height:12px;background:#f1efea;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(0,0,0,.05)}
.field{width:100%;border:0;border-radius:16px;background:var(--well);box-shadow:inset 0 2px 5px rgba(0,0,0,.16),inset 0 -1px 0 #fff;padding:12px 14px;font:16px/1.4 Inter,sans-serif;color:var(--ink);resize:none}
.field::placeholder{color:var(--soft)}
input.field{height:52px;padding:0 16px;font-family:var(--hel);font-weight:500;font-size:19px}
/* week */
.grid{display:flex;flex-direction:column;gap:3px}
.grid .r{display:flex;align-items:center;gap:3px}
.grid .d{width:30px;flex:none;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid .d.today{color:var(--ink);font-weight:500}
.grid i{border-radius:50%;flex:none;box-sizing:border-box}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;box-sizing:border-box}
/* menu & plan */
.mrow{display:flex;align-items:flex-start;gap:10px;padding:13px 0;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.mrow:last-child{border-bottom:1px solid var(--line)}
.mrow .num{font:12px var(--mono);color:var(--muted);width:28px;flex:none;padding-top:3px}
.mrow .tt{font-family:var(--hel);font-weight:500;font-size:19px;letter-spacing:-.01em}
.mrow svg{align-self:center;flex:none}
.prow{display:flex;align-items:center;gap:10px;min-height:30px;border:0;border-bottom:1px solid var(--line2);background:none;width:100%;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.prow.lock{cursor:default}
.prow .t{font:12px var(--mono);color:var(--muted);width:44px;flex:none}
.prow .n{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .du{font:12px var(--mono);flex:none}
.tag{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--dim);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* drum */
.drum{position:relative;height:150px;border-radius:20px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.18),inset 0 -1px 0 #fff;display:flex;align-items:center;justify-content:center;gap:18px;overflow:hidden;flex:none}
.drum .bandsel{position:absolute;left:10px;right:10px;top:57px;height:36px;border-radius:12px;background:linear-gradient(180deg,#f8f6f1 0%,#e6e3dc 100%);box-shadow:0 4px 10px -4px rgba(0,0,0,.35),inset 0 1px 0 #fff}
.dcol{position:relative;z-index:1;height:150px;width:64px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:60px 0;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.dcol::-webkit-scrollbar{display:none}
.dcol span{display:flex;height:30px;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--hel);font-weight:500;font-size:18px;color:#a6a299;font-variant-numeric:tabular-nums}
.dcol span.near{font-size:21px;color:var(--soft)}
.dcol span.sel{font-size:26px;color:var(--ink)}
.drum .sep{position:relative;z-index:1;font-family:var(--hel);font-weight:500;font-size:24px}
/* horizontal wake scale */
.hscale{position:relative;height:78px;flex:none;margin:0 6px}
.hscale .base{position:absolute;left:0;right:0;top:30px;height:1px;background:var(--dim)}
.hscale .tk{top:30px;width:1px;right:auto;background:var(--dim)}
.hscale .hl{top:52px;right:auto;transform:translateX(-50%)}
.hscale .lab{position:absolute;top:0;transform:translateX(-50%);font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);z-index:20;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);max-width:calc(100% - 40px)}
.toast button{border:0;background:#3a3835;color:var(--paper);border-radius:999px;height:34px;padding:0 14px;font-weight:500;cursor:pointer}
.toast[hidden]{display:none}
/* loading */
#splash{position:fixed;inset:0;z-index:50;background:#0e0d0c;color:#e5e2da;overflow:hidden;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{position:absolute;left:0;top:0;width:100%;height:76%;object-fit:cover;object-position:62% 30%}
#splash .g1{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(180deg,rgba(14,13,12,.85),rgba(14,13,12,0))}
#splash .g2{position:absolute;left:0;right:0;top:47%;bottom:0;background:linear-gradient(180deg,rgba(14,13,12,0) 0%,rgba(14,13,12,.9) 45%,#0e0d0c 70%)}
#splash .no{position:absolute;right:24px;top:calc(var(--sat) + 16px);font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#d9d5cc}
#splash .bot{position:absolute;left:24px;right:24px;bottom:calc(var(--sab) + 40px);display:flex;flex-direction:column;gap:18px}
#splash h1{margin:0;font-family:var(--hel);font-weight:500;font-size:54px;letter-spacing:-.02em;line-height:1;color:#ece9e1}
#splash .meta{display:flex;justify-content:space-between;font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#b9b5ac}
#splash .dots{display:flex;gap:6px}
#splash .dots i{width:8px;height:8px;border-radius:50%;background:#3a3835;flex:none}
#splash .dots i.on{background:#e5e2da}
#splash .dots i.hd{background:#e5482b}
@media (prefers-reduced-motion:reduce){.tog .knob,.mini::after,#splash{transition:none}}
@media (max-height:700px){.tile{height:80px;font-size:min(62px,18vw)}.tile::after{top:40px}}
</style>
</head>
<body>

<div id="splash" aria-hidden="true">
<img src="img/engraving.jpg" alt="">
<div class="g1"></div><div class="g2"></div>
<span class="no" id="sp-no"></span>
<div class="bot">
<h1>Устав</h1>
<div class="meta"><span id="sp-day"></span><span id="sp-date"></span></div>
<div class="dots" id="sp-dots"></div>
</div>
</div>

<main>
<section class="screen" id="s-morning"></section>
<section class="screen" id="s-wake"></section>
<section class="screen" id="s-now"></section>
<section class="screen" id="s-day"></section>
<section class="screen" id="s-journal"></section>
<section class="screen" id="s-week"></section>
<section class="screen" id="s-menu"></section>
<section class="screen" id="s-plan"></section>
<section class="screen" id="s-item"></section>
<section class="screen" id="s-export"></section>
<section class="screen" id="s-backup"></section>
</main>

<nav class="bar" id="bar" aria-label="Экраны"></nav>
<div class="toast" id="toast" role="status" hidden><span id="toast-t"></span><button type="button" id="toast-b">Вернуть</button></div>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const LS = "ustav-v2";
const SPRINT = "2026-11-27";     // first day of the MVP sprint
const SPRINT_DAYS = 7;
const DAY_LEN = 930;             // wake → bed, minutes (15 h 30)
const SLEEP = 510;               // 8 h 30
const EARLIEST = 480;            // the sleep shift stops at 08:00
const CUTOFF = 5;                // a day can be marked until 05:00

const DEFAULT_TPL = [
  { id: "wake", t: "Подъём", d: 10, lock: 1, desc: "Вода и свет. Лента — потом." },
  { id: "stoicAM", t: "Стоицизм и 3 задачи", d: 10, main: 1, short: "Что сегодня в моей власти?", desc: "Что сегодня в моей власти? Три главных дела — в дневник." },
  { id: "breakfast", t: "Завтрак", d: 45, main: 1, short: "15 мин готовки, 30 мин еды", desc: "15 минут готовки, 30 минут еды." },
  { id: "work1", t: "Окно работы №1", d: 10, desc: "Ответить работодателю. Основная работа — только в окнах." },
  { id: "mvp1", t: "MVP · блок 1", d: 135, main: 1, desc: "Одна задача агента — до конца." },
  { id: "slotA", slot: "A", d: 60, main: 1 },
  { id: "lunch", t: "Обед", d: 30, main: 1, desc: "30 минут, без экрана." },
  { id: "tea", t: "Чай", d: 30, desc: "Чайная пауза." },
  { id: "work2", t: "Окно работы №2", d: 15, desc: "Ответить работодателю." },
  { id: "mvp2", t: "MVP · блок 2", d: 120, main: 1, desc: "Продолжить с того места, где остановились." },

function cardFor(k) {
  const sc = sched(k), nm = nowMin(k), marks = peek(k).marks;
  const vis = visible(sc.items).filter(x => x.e > x.s || x.id === "sleep");
  const cur = vis.find(x => x.s <= nm && nm < x.e);
  if (cur && !marks[cur.id]) return { item: cur, mode: "now", sc: sc, nm: nm, vis: vis };
  const next = vis.find(x => x.s > nm && !marks[x.id]);
  if (next) return { item: next, mode: "next", sc: sc, nm: nm, vis: vis };
  return { item: cur || vis[vis.length - 1], mode: "end", sc: sc, nm: nm, vis: vis };
}

function drawScale(c) {
  const box = $("#scale"); if (!box) return;
  const H = box.clientHeight, PX = 70 / 60, span = H / PX, marks = peek(K).marks, nm = c.nm;
  let ws = Math.floor((nm - 45) / 15) * 15;
  ws = Math.max(ws, Math.floor(c.sc.S / 15) * 15);
  const we = ws + span, y = m => (m - ws) * PX;
  let h = "";
  for (let m = Math.ceil(ws / 15) * 15; m <= we; m += 15) {
    const hr = mod(m, 60) === 0;
    h += '<i class="tk' + (hr ? " hr" : "") + '" style="top:' + y(m).toFixed(1) + 'px"></i>';
    if (hr && y(m) > 6) h += '<b class="hl" style="top:' + (y(m) - 5).toFixed(1) + 'px">' + Math.floor(mod(m, 1440) / 60) + "</b>";
  }
  const band = (a, b, cls) => '<span class="band ' + cls + '" style="top:' + y(a).toFixed(1) + "px;height:" + Math.max(2, y(b) - y(a) - 3).toFixed(1) + 'px"></span>';
  c.vis.forEach(x => {
    const e = x.id === "sleep" ? x.s + 60 : x.e;
    if (e <= ws || x.s >= we || e === x.s) return;
    const a = Math.max(x.s, ws), b = Math.min(e, we);
    if (marks[x.id]) h += band(a, b, "b-done");
    else if (x.s <= nm && nm < e) h += band(a, nm, "b-done") + band(nm, b, "b-cur");
    else h += band(a, b, e <= nm ? "b-miss" : "b-fut");
  });
  let lastY = -99;
  c.vis.forEach(x => {
    if (x.s < ws || x.s >= we) return;
    const yy = y(x.s);
    if (yy - lastY < 19) return;
    lastY = yy;
    h += '<div class="sl" style="top:' + (yy - 3).toFixed(1) + 'px"><span class="t">' + fmt(x.s) + '</span><span class="n' + (x.id === c.item.id ? " cur" : "") + '">' + esc(x.t) + "</span></div>";
  });
  h += '<span class="nowline" style="top:' + (y(nm) - 1).toFixed(1) + 'px"></span><span class="nowdot" style="top:' + (y(nm) - 5).toFixed(1) + 'px"></span>';
  box.innerHTML = h;
}

function bindSlider() {
  const tr = $("#slide"); if (!tr) return;
  const kn = tr.querySelector(".kn");
  let x0 = null, dx = 0, max = 0;
  kn.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; max = tr.clientWidth - kn.offsetWidth - 12; dragging = true; kn.style.transition = "none"; try { kn.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } });
  kn.addEventListener("pointermove", e => { if (x0 == null) return; dx = Math.max(0, Math.min(max, e.clientX - x0)); kn.style.transform = "translateX(" + dx + "px)"; });
  const end = () => {
    if (x0 == null) return;
    x0 = null; dragging = false;
    kn.style.transition = "transform .2s ease";
    if (dx >= max * 0.8) { kn.style.transform = "translateX(" + max + "px)"; setTimeout(() => markDone(kn.dataset.id), 200); }
    else kn.style.transform = "translateX(0)";
    dx = 0;
  };
  kn.addEventListener("pointerup", end);
  kn.addEventListener("pointercancel", end);
  kn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); markDone(kn.dataset.id); } });
}

function weekInfo() {

function dial(n, target) {
  const f = Math.max(0, Math.min(1, target ? n / target : 0)), th = Math.PI - Math.PI * f;
  const px = (48 + 40 * Math.cos(th)).toFixed(1), py = (52 - 40 * Math.sin(th)).toFixed(1);
  const nx = (48 + 30 * Math.cos(th)).toFixed(1), ny = (52 - 30 * Math.sin(th)).toFixed(1);
  let ticks = "";
  const steps = Math.min(Math.max(target, 1), 10);
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI - Math.PI * i / steps, c = Math.cos(a), s = Math.sin(a);
    ticks += '<path d="M' + (48 + 40 * c).toFixed(1) + " " + (52 - 40 * s).toFixed(1) + "L" + (48 + 34 * c).toFixed(1) + " " + (52 - 34 * s).toFixed(1) + '"/>';
  }
  return '<svg width="96" height="58" viewBox="0 0 96 58" fill="none" role="img" aria-label="' + n + " из " + target + '"><path d="M8 52A40 40 0 0 1 88 52" stroke="#8a867c" stroke-width="1"/>' +
    (f > 0 ? '<path d="M8 52A40 40 0 0 1 ' + px + " " + py + '" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>' : "") +
    '<g stroke="#161616" stroke-width="1.4" stroke-linecap="round">' + ticks + "</g>" +
    '<path d="M48 52L' + nx + " " + ny + '" stroke="#e5482b" stroke-width="2" stroke-linecap="round"/><circle cx="48" cy="52" r="4.5" fill="#e5482b"/><circle cx="48" cy="52" r="1.6" fill="#e5e2da"/></svg>';
}

/* ---------- calendar file ---------- */
function icsEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function fold(line) {
  const enc = new TextEncoder(); let out = "", cur = "", n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 73) { out += cur + "\r\n "; cur = ""; n = 1; } cur += ch; n += b; }
  return out + cur;
}
function icsDT(k, m) { const dk = addDays(k, Math.floor(m / 1440)); const mm = mod(m, 1440); return dk.replace(/-/g, "") + "T" + pad(Math.floor(mm / 60)) + pad(mm % 60) + "00"; }
function buildIcs() {
  const d = day(K), sc = sched(K), on = started(K), nm = on ? nowMin(K) : -1e9;
  const up = visible(sc.items).filter(x => x.s > nm);
  const list = state.settings.expMode === "all" ? up : up.filter(x => x.main && !x.free);
  const seq = (d.expN || 0) + 1;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ustav dnya//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Устав"];
  list.forEach(x => {
    const dur = x.id === "sleep" ? 15 : Math.max(5, x.e - x.s);
    L.push("BEGIN:VEVENT", "UID:ustav-" + K + "-" + x.id + "@ustav-dnya", "SEQUENCE:" + seq, "DTSTAMP:" + stamp,
      "DTSTART:" + icsDT(K, x.s), "DTEND:" + icsDT(K, x.s + dur), "SUMMARY:" + icsEsc(x.t), "DESCRIPTION:" + icsEsc(x.desc || ""),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(x.t), "TRIGGER:PT0S", "END:VALARM", "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n") + "\r\n";
}
function markExported() { const d = day(K); d.expN = (d.expN || 0) + 1; d.exp = { sig: sig(K), at: nowMin(K) }; d.promptOff = 1; delete d.dis; save(); }
function saveFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------- actions ---------- */
const A = {
  pickOn() { ui.pick = true; render(); },
  pickOff() { ui.pick = false; ui.pickVal = null; render(); },
  cookTog(el) {

  start() {

    if (S > nm) return;
    const d = day(K); d.start = S; d.W0 = plannedWake(K); save();

  },
  lockTog() { ui.lock = !ui.lock; render(); },

  stripClose(el) {

  },
  tip(el) { const k = "tip_" + el.dataset.id; ui[k] = !ui[k]; render(); },
  nbTog() { const d = day(K); d.nb = !d.nb; save(); render(); },
  goalPlus() { state.goal.n++; save(); render(); },
  goalMinus() { state.goal.n = Math.max(0, state.goal.n - 1); save(); render(); },
  goalRename() { const t = prompt("Цель", state.goal.t); if (t && t.trim()) { state.goal.t = t.trim().slice(0, 60); save(); render(); } },
  goalTarget() { const t = parseInt(prompt("Сколько всего?", state.goal.target), 10); if (t > 0 && t < 1000) { state.goal.target = t; save(); render(); } },
  shrinkTog(el) {

  expMode(el) { state.settings.expMode = el.getAttribute("aria-checked") === "true" ? "main" : "all"; save(); render(); },
  doExport() {

  bkSave() {

  },

  planReset() {
    if (!confirm("Вернуть исходный распорядок? Ваши пункты и изменения пропадут, отметки останутся.")) return;
    state.settings.tpl = clone(DEFAULT_TPL); state.settings.shrunk = {};

  },
  edMinus() { ED.d = Math.max(5, ED.d - 5); render(); },

  edMine() { ED.mine = !ED.mine; render(); },
  edScope() { ED.scope = ED.scope === "all" ? "today" : "all"; render(); },
  edSave() {
    if (!ED.slot && !ED.t.trim()) return;
    const st = state.settings, d = state.days[K];
    if (ED.scope === "today") { const dd = day(K); dd.tpl = applyEdit(dd.tpl || st.tpl); }
    else { st.tpl = applyEdit(st.tpl); if (d && d.tpl) d.tpl = applyEdit(d.tpl); }
    save();
    ED = null;
    pendingSaved = true;
    go("plan");
    if (!stripState(K, false)) toast("Сохранено");
  },
  edDel() {
    if (!confirm("Удалить «" + ED.t + "»?")) return;
    const st = state.settings, d = state.days[K];
    const rm = arr => arr.filter(x => x.id !== ED.id);
    if (ED.scope === "today") { const dd = day(K); dd.tpl = rm(dd.tpl || st.tpl); }
    else { st.tpl = rm(st.tpl); if (d && d.tpl) d.tpl = rm(d.tpl); }
    save(); ED = null; pendingSaved = true; go("plan");
  }
};
function moveEd(dir) {
  const key = ED.id || "__new", i = ED.order.indexOf(key), j = i + dir;
  if (j < 1 || j > ED.order.length - 2) return;
  ED.order.splice(i, 1); ED.order.splice(j, 0, key);
  render();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  const q = e.target.dataset && e.target.dataset.q;
  if (q) { day(K).j[q] = e.target.value; save(); }
});
document.addEventListener("focusin", e => { if (e.target.matches("textarea,input")) document.body.classList.add("kb"); });
document.addEventListener("focusout", e => { if (e.target.matches("textarea,input")) document.body.classList.remove("kb"); });

/* ---------- clock & refresh ---------- */
function tick() {
  const d = new Date(), h = $("#s-" + route + " #ck-h"), m = $("#s-" + route + " #ck-m");
  if (h && h.textContent !== pad(d.getHours())) h.textContent = pad(d.getHours());
  if (m && m.textContent !== pad(d.getMinutes())) { m.textContent = pad(d.getMinutes()); const c = $("#s-" + route + " #clock"); if (c) c.setAttribute("aria-label", pad(d.getHours()) + ":" + pad(d.getMinutes())); }
}
setInterval(tick, 5000);
setInterval(() => {
  if (logicalKey() !== K) { onRoute(); return; }
  if (!dragging && (route === "now" || route === "day")) render();
}, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) onRoute(); });
window.addEventListener("hashchange", onRoute);
window.addEventListener("resize", () => { if (route === "now" && !dragging) render(); });

/* ---------- splash ---------- */
function splash() {
  const sp = $("#splash"), k = logicalKey(), n = sprintDay(k);
  $("#sp-no").textContent = n ? "Nº " + pad(n) + " / " + pad(SPRINT_DAYS) : "";
  const since = diffDays(SPRINT, k) + 1;
  $("#sp-day").textContent = n ? "День " + n + " · спринт" : (since > 0 ? "День " + since : "");
  $("#sp-date").textContent = WD[parseKey(k).getDay()] + " " + shortDate(k);
  const dots = $("#sp-dots");
  dots.innerHTML = "<i></i>".repeat(24);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;
  const step = () => { Array.from(dots.children).forEach((d, j) => { d.className = j < i ? "on" : (j === i ? "hd" : ""); }); i++; };
  step();
  const t = reduce ? null : setInterval(step, 45);
  setTimeout(() => { if (t) clearInterval(t); sp.classList.add("out"); setTimeout(() => sp.remove(), 400); }, reduce ? 500 : 1150);
}

splash();
onRoute();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
